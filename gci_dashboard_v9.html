<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCI — Dashboard de Acompanhamento de Ativos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f7;min-height:100vh;padding:20px}
:root{--gci:#1a4a5c;--gci-dark:#0d2f3d;--gci-mid:#2a6880;--border:#d4dde4;--bg:#fff;--bg2:#f0f4f7;--text:#1a2e3b;--text2:#5a7a8a;--text3:#9ab0bc}
.db{max-width:1400px;margin:0 auto}
.topbar{background:var(--gci);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-radius:12px;margin-bottom:20px}
.logo-circle{width:42px;height:42px;background:var(--gci-dark);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;letter-spacing:.5px;flex-shrink:0}
.topbar-title{color:#fff;font-size:16px;font-weight:600}
.topbar-sub{color:rgba(255,255,255,.55);font-size:12px;margin-top:2px}
.topbar-right{color:rgba(255,255,255,.45);font-size:12px}
.filters-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:7px 12px;flex:1;min-width:200px;max-width:380px}
.search-box input{border:none;background:transparent;font-size:13px;color:var(--text);outline:none;width:100%}
.search-box input::placeholder{color:var(--text3)}
.fbtn{padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:13px;color:var(--text2);cursor:pointer;transition:all .12s}
.fbtn.active{background:var(--gci);color:#fff;border-color:var(--gci)}
.fbtn:hover:not(.active){background:#e8f0f4}
.fsel{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--text2)}
.fsel select{border:none;background:transparent;font-size:13px;color:var(--text);cursor:pointer;outline:none;max-width:200px}
.sumrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.sumcard{background:#fff;border-radius:10px;padding:14px 18px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sumlabel{font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.sumval{font-size:26px;font-weight:600;color:var(--text)}
.sumval.c1{color:var(--gci)}.sumval.c2{color:#b87a00}.sumval.c3{color:#c0392b}.sumval.c4{color:var(--text3)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.acard{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:box-shadow .15s,border-color .15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.acard:hover{box-shadow:0 4px 12px rgba(26,74,92,.1);border-color:#b0c8d4}
.cheader{background:var(--gci);padding:14px 16px 0;position:relative}
.cheader-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.ctype{font-size:10px;font-weight:600;letter-spacing:1px;color:rgba(255,255,255,.55);text-transform:uppercase;display:flex;align-items:center;gap:5px}
.cname{font-size:14px;font-weight:600;color:#fff;line-height:1.3;margin-bottom:3px}
.csub{font-size:11px;color:rgba(255,255,255,.5);margin-bottom:12px;line-height:1.4}
.sbadge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.s-at{background:rgba(39,174,96,.2);color:#27ae60}.s-at .sdot{background:#27ae60}
.s-in{background:rgba(231,76,60,.2);color:#e74c3c}.s-in .sdot{background:#e74c3c}
.s-ca{background:rgba(149,165,166,.2);color:#95a5a6}.s-ca .sdot{background:#95a5a6}
.s-li{background:rgba(127,140,141,.2);color:#7f8c8d}.s-li .sdot{background:#7f8c8d}
.num-badge{display:inline-block;background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px}
.tabnav{display:flex;background:#0f3347;overflow-x:auto;scrollbar-width:none}
.tabnav::-webkit-scrollbar{display:none}
.tabitem{flex-shrink:0;padding:9px 13px;font-size:11px;font-weight:500;color:rgba(255,255,255,.5);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .12s,border-color .12s;user-select:none}
.tabitem.on{color:#fff;border-bottom-color:#3dd68c}
.tabitem:hover:not(.on){color:rgba(255,255,255,.8)}
.tabpanel{padding:14px 16px;display:none}
.tabpanel.on{display:block}
.frow{display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;gap:8px;border-bottom:1px solid #eef2f5}
.frow:last-child{border-bottom:none}
.flabel{font-size:12px;color:var(--text2);flex-shrink:0;min-width:130px;padding-right:8px;line-height:1.4}
.fval{font-size:12px;color:var(--text);text-align:right;font-weight:500;line-height:1.4}
.fval.em{color:var(--text3);font-weight:400;font-style:italic}
.tbl-section{position:relative;padding-bottom:44px}
.tbl-wrap{overflow-x:auto}
.dtbl{width:100%;border-collapse:collapse;font-size:12px}
.dtbl th{text-align:left;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.4px;padding:6px 10px 6px 0;border-bottom:1px solid #eef2f5;white-space:nowrap;text-transform:uppercase}
.dtbl td{padding:8px 10px 8px 0;border-bottom:1px solid #eef2f5;color:var(--text2);font-style:italic;vertical-align:top;line-height:1.4}
.dtbl tr.filled td{color:var(--text);font-style:normal}
.dtbl tr:last-child td{border-bottom:none}
.btn-add{position:absolute;bottom:6px;right:0;width:32px;height:32px;border-radius:50%;background:var(--gci);border:none;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s;line-height:1;box-shadow:0 2px 8px rgba(26,74,92,.3)}
.btn-add:hover{background:var(--gci-mid)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:22px;width:440px;max-width:94vw;max-height:84vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:16px}
.modal-field{margin-bottom:12px}
.modal-field label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px}
.modal-field input,.modal-field textarea{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13px;color:var(--text);font-family:inherit;outline:none;transition:border-color .12s}
.modal-field textarea{resize:vertical;min-height:64px}
.modal-field input:focus,.modal-field textarea:focus{border-color:var(--gci)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn-cancel{padding:8px 18px;border-radius:7px;border:1px solid var(--border);background:#f0f4f7;font-size:13px;color:var(--text2);cursor:pointer;font-family:inherit}
.btn-save{padding:8px 18px;border-radius:7px;border:none;background:var(--gci);font-size:13px;color:#fff;cursor:pointer;font-family:inherit}
.btn-cancel:hover{background:#e0e8ed}
.btn-save:hover{background:var(--gci-mid)}


/* === POST-IT BUTTON === */
.nota-btn{position:relative;width:26px;height:26px;border-radius:6px;border:none;background:#f5d400;color:#7a6800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:background .12s,transform .1s;z-index:2;flex-shrink:0}
.nota-btn:hover{background:#f0c800;transform:scale(1.08)}
.nota-btn.has-nota{background:#f5d400;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.nota-btn.has-nota::after{content:'';position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#e74c3c}
.nota-popup{display:none;position:absolute;top:32px;right:0;width:240px;background:#fffbe6;border:1px solid #e0cc00;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:100;padding:10px}
.nota-popup.open{display:block}
.nota-popup textarea{width:100%;border:1px solid #e0d000;border-radius:5px;padding:7px 8px;font-size:12px;color:#4a3e00;background:#fffff5;font-family:inherit;outline:none;resize:vertical;min-height:80px;line-height:1.5}
.nota-popup textarea:focus{border-color:#c8a800}
.nota-popup-footer{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
.nota-popup-save{padding:4px 12px;border-radius:5px;border:none;background:#c8a800;font-size:11px;color:#fff;cursor:pointer;font-family:inherit}
.nota-popup-cancel{padding:4px 10px;border-radius:5px;border:1px solid #d4c000;background:transparent;font-size:11px;color:#7a6800;cursor:pointer;font-family:inherit}


/* === BOTÃO ENCERRAR / REATIVAR === */
.card-footer{display:none}
.btn-status-toggle{padding:5px 14px;border-radius:6px;border:none;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .12s}
.btn-encerrar{background:#f0f4f7;color:#5a7a8a;border:1px solid var(--border)}
.btn-encerrar:hover{background:#e0eaf0;color:#1a4a5c}
.btn-reativar{background:#e8f7f0;color:#1a7a4a;border:1px solid #a8d8bc}
.btn-reativar:hover{background:#d4f0e4;color:#0f5c35}

/* === HISTÓRICO DE ASSEMBLEIA === */
.hist-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.hist-btn{font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid var(--border);background:#f0f4f7;color:var(--text2);cursor:pointer;font-family:inherit;white-space:nowrap}
.hist-btn:hover{background:#e0eaf0;color:var(--gci)}
.hist-expanded{background:#f8fafc;border-radius:6px;padding:8px 10px;margin-top:6px;font-size:12px;color:var(--text);line-height:1.5;border:1px solid #eef2f5;white-space:pre-wrap;word-break:break-word}

/* === BOTÃO EXCLUIR LINHA === */
.tbl-del-btn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;border:none;background:transparent;color:#c0392b;cursor:pointer;font-size:14px;padding:0;line-height:1;opacity:.5;transition:opacity .12s}
.tbl-del-btn:hover{opacity:1;background:#fde8e8}

/* === MODAL HISTÓRICO === */
.hist-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1100;align-items:center;justify-content:center}
.hist-modal-overlay.open{display:flex}
.hist-modal{background:#fff;border-radius:12px;padding:22px;width:500px;max-width:94vw;max-height:84vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.hist-modal-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.hist-modal-sub{font-size:12px;color:var(--text2);margin-bottom:14px}
.hist-modal textarea{width:100%;border:1px solid var(--border);border-radius:7px;padding:9px 11px;font-size:13px;color:var(--text);font-family:inherit;outline:none;resize:vertical;min-height:120px;line-height:1.5}
.hist-modal textarea:focus{border-color:var(--gci)}
.hist-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

.no-res{text-align:center;padding:4rem;color:var(--text3);font-size:14px;grid-column:1/-1}
@media(max-width:600px){.sumrow{grid-template-columns:repeat(2,1fr)}.cgrid{grid-template-columns:1fr}.filters-row{flex-wrap:wrap}}

/* ===== ABAS PRINCIPAIS ===== */
.main-tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--border);padding-bottom:0}
.main-tab{padding:10px 22px;border:none;background:transparent;font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .12s,border-color .12s;font-family:inherit}
.main-tab.active{color:var(--gci);border-bottom-color:var(--gci);font-weight:600}
.main-tab:hover:not(.active){color:var(--text)}

/* ===== CONTROLS ROW ===== */
.controls-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}

/* ===== CHIPS DE FILTRO ===== */
.chips-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .12s;font-family:inherit}
.chip.chip-active,.chip:hover{background:#e8f4f8;border-color:#1a4a5c;color:#1a4a5c}
.chip.on{background:#1a4a5c;border-color:#1a4a5c;color:#fff}
.chip.chip-danger:hover,.chip.chip-danger.on{background:#fde8e8;border-color:#c0392b;color:#c0392b}
.chip.chip-muted:hover,.chip.chip-muted.on{background:#f0f4f7;border-color:#7f8c8d;color:#5a7a8a}
.chip-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;font-size:11px;font-weight:700;background:rgba(26,74,92,.12);color:inherit;padding:0 5px}
.chip.on .chip-badge{background:rgba(255,255,255,.25);color:#fff}
.chip-badge-danger{background:rgba(192,57,43,.12);color:#c0392b}
.chip-badge-muted{background:rgba(127,140,141,.12);color:#7f8c8d}

/* ===== ALERTAS ===== */
.alert-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.alert-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:16px;font-size:12px;font-weight:500;background:#fff3cd;border:1px solid #ffc107;color:#856404}
.alert-chip.red{background:#fde8e8;border-color:#e74c3c;color:#c0392b}
.alert-chip.blue{background:#e8f4f8;border-color:#3498db;color:#1a5276}

/* ===== BOTÃO NOVO INVESTIDOR ===== */
.btn-add-inv{padding:7px 18px;border-radius:8px;border:none;background:var(--gci);color:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .12s}
.btn-add-inv:hover{background:var(--gci-mid)}

/* ===== LISTA INVESTIDORES ===== */
.inv-list-wrap{display:flex;flex-direction:column;gap:0}
.inv-row{background:#fff;border:1px solid var(--border);border-radius:0;padding:14px 20px;display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:16px;cursor:pointer;transition:background .12s,border-color .12s;position:relative}
.inv-row:first-child{border-radius:10px 10px 0 0}
.inv-row:last-child{border-radius:0 0 10px 10px}
.inv-row:only-child{border-radius:10px}
.inv-row+.inv-row{border-top:none}
.inv-row:hover{background:#f8fafc;border-color:#b0c8d4}
.inv-row-left{display:flex;flex-direction:column;gap:3px}
.inv-row-name{font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px}
.inv-row-sub{font-size:12px;color:var(--text2)}
.inv-type-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:#e8f4f8;color:#1a4a5c;border:1px solid #b0c8d4}
.inv-col{text-align:right}
.inv-col-label{font-size:11px;color:var(--text3);margin-bottom:2px;text-transform:uppercase;letter-spacing:.4px}
.inv-col-val{font-size:14px;font-weight:600;color:var(--text)}
.inv-col-val.green{color:#27ae60}
.inv-status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.inv-status-ativo{background:rgba(39,174,96,.15);color:#27ae60}
.inv-status-inativo{background:rgba(127,140,141,.15);color:#7f8c8d}
.inv-arrow{color:var(--text3);font-size:18px;flex-shrink:0}

/* ===== DETALHE INVESTIDOR ===== */
.inv-detail-wrap{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden}
.inv-detail-header{background:var(--gci);padding:16px 20px;display:flex;align-items:flex-start;justify-content:space-between}
.inv-detail-name{font-size:17px;font-weight:600;color:#fff;margin-bottom:3px}
.inv-detail-sub{font-size:12px;color:rgba(255,255,255,.6)}
.inv-detail-back{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 14px;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit}
.inv-detail-back:hover{background:rgba(255,255,255,.25)}
.inv-detail-tabs{display:flex;background:#0f3347;overflow-x:auto;scrollbar-width:none}
.inv-detail-tabs::-webkit-scrollbar{display:none}
.inv-dtab{flex-shrink:0;padding:9px 14px;font-size:11px;font-weight:500;color:rgba(255,255,255,.5);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .12s,border-color .12s}
.inv-dtab.on{color:#fff;border-bottom-color:#3dd68c}
.inv-dtab:hover:not(.on){color:rgba(255,255,255,.8)}
.inv-detail-body{padding:16px 20px}
.inv-pos-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.inv-pos-table th{text-align:left;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.4px;padding:7px 10px 7px 0;border-bottom:1px solid #eef2f5;text-transform:uppercase;white-space:nowrap}
.inv-pos-table td{padding:10px 10px 10px 0;border-bottom:1px solid #eef2f5;color:var(--text);vertical-align:middle;font-size:13px}
.inv-pos-table tr:last-child td{border-bottom:none}
.inv-pos-table tfoot td{font-weight:600;color:var(--gci);border-top:2px solid var(--border);padding-top:10px}
.inv-edit-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:#f0f4f7;font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit}
.inv-edit-btn:hover{background:#e0eaf0;color:var(--gci)}

/* ===== MODAL INVESTIDOR ===== */
.inv-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1200;align-items:center;justify-content:center}
.inv-modal-overlay.open{display:flex}
.inv-modal{background:#fff;border-radius:12px;padding:22px;width:560px;max-width:94vw;max-height:86vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.inv-modal-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:16px}
.inv-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inv-modal-grid .full{grid-column:1/-1}

.fchip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .12s;font-family:inherit}
.fchip.fchip-active,.fchip:hover{background:#e8f4f8;border-color:#1a4a5c;color:#1a4a5c}
.fchip.on{background:#1a4a5c;border-color:#1a4a5c;color:#fff}
.fchip.chip-danger:hover,.fchip.chip-danger.on{background:#fde8e8;border-color:#c0392b;color:#c0392b}
.fchip.chip-muted:hover,.fchip.chip-muted.on{background:#f0f4f7;border-color:#7f8c8d;color:#5a7a8a}
.fchip.on .chip-badge{background:rgba(255,255,255,.25);color:#fff}
</style>
</head>
<body>
<div class="db">
<div class="topbar">
  <div style="display:flex;align-items:center;gap:14px">
    <div class="logo-circle">GCI</div>
    <div>
      <div class="topbar-title">Grupo Ceres Investimentos</div>
      <div class="topbar-sub">Relações com Investidores &amp; Distribuição — Acompanhamento de Ativos</div>
    </div>
  </div>
  <div class="topbar-right" id="lbl-total">46 ativos</div>
</div>
<!-- ABAS PRINCIPAIS -->
<div class="main-tabs">
  <button class="main-tab active" data-section="cras">CRAs</button>
  <button class="main-tab" data-section="fundos">Fundos</button>
  <button class="main-tab" data-section="investidores">Investidores</button>
</div>

<!-- SECAO CRAs -->
<div id="section-cras">
  <div class="controls-row">
    <div class="search-box">
      <svg width="15" height="15" fill="none" stroke="#9ab0bc" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="srch" placeholder="Buscar por nome, devedor, ISIN, código...">
    </div>
    <div class="chips-row">

function sc(s){if(s==='Vigente')return 's-at';if(s==='Inadimplente')return 's-in';if(s==='Cancelada')return 's-ca';return 's-li';}
function isEncerrado(s){return['Encerrada','Encerrado','Cancelada'].includes(s);}
function fv(v){return v?`<span class="fval">${v}</span>`:`<span class="fval em">—</span>`;}
function fields(o){return Object.entries(o).map(([k,v])=>`<div class="frow"><span class="flabel">${k}</span>${fv(v)}</div>`).join('');}
function tblA(rows,aid){
const hasData=rows&&rows.length>0;
const d=hasData?rows:Array(2).fill({data:'',pauta:'',deliberacao:'',hist:''});
return `<div class="tbl-section"><div class="tbl-wrap"><table class="dtbl">
<thead><tr><th></th><th style="min-width:90px">Data</th><th style="min-width:180px">Pauta</th><th style="min-width:180px">Deliberação</th><th style="min-width:80px">Histórico</th></tr></thead>
<tbody>${d.map((r,i)=>{
const filled=hasData&&r.data;
const histBtn=filled?`<button class="hist-btn" data-aid="${aid}" data-idx="${i}" title="Ver/editar histórico">📝 detalhes</button>`:'—';
const histExp=r.hist?`<div class="hist-expanded">${r.hist}</div>`:'';
return `<tr class="${filled?'filled':''}">
<td style="width:28px">${filled?`<button class="tbl-del-btn" data-aid="${aid}" data-tab="assembleias" data-idx="${i}" title="Excluir">✕</button>`:''}</td>
<td>${r.data||'—'}</td>
<td style="white-space:normal">${r.pauta||'—'}</td>
<td style="white-space:normal">${r.deliberacao||'—'}</td>
<td>${histBtn}${histExp}</td>
</tr>`;}).join('')}
</tbody></table></div>
<button class="btn-add" data-aid="${aid}" data-tab="assembleias" title="Adicionar assembleia">+</button>
</div>`;}

const d=hasData?rows:Array(2).fill({data:'',operacao:'',investidor:'',nomeContato:'',assunto:'',obs:''});
return `<div class="tbl-section"><div class="tbl-wrap"><table class="dtbl">
<thead><tr><th></th><th style="min-width:90px">Data</th><th style="min-width:100px">Operação</th><th style="min-width:120px">Investidor</th><th style="min-width:120px">Nome do contato</th><th style="min-width:160px">Assunto/Solicitação</th><th style="min-width:140px">Observação</th></tr></thead>

function tc(a,tid){
if(tid==='info'){
const isEnc=isEncerrado(a.status);
const tBtn=isEnc
?`<div style="margin-top:12px;padding-top:10px;border-top:1px solid #eef2f5"><button class="btn-status-toggle btn-reativar" data-aid="${a.id}" title="Reativar">↺ Reativar CRA</button></div>`
:`<div style="margin-top:12px;padding-top:10px;border-top:1px solid #eef2f5"><button class="btn-status-toggle btn-encerrar" data-aid="${a.id}" title="Encerrar">✓ Encerrar CRA</button></div>`;
return fields(a.info)+tBtn;}
if(tid==='prest') return a.prest?fields(a.prest):'<span style="color:var(--text3);font-style:italic;font-size:12px">Sem dados.</span>';
if(tid==='lim') return a.lim?fields(a.lim):'<span style="color:var(--text3);font-style:italic;font-size:12px">Sem dados.</span>';
if(tid==='cov'){
if(!a.cov||!a.cov.length) return '<div style="font-size:12px;color:var(--text3);font-style:italic;padding:8px 0">Nenhum covenant registrado.</div>';
return a.cov.map(c=>`<div class="frow"><span class="flabel">${c.nome}</span>${fv(c.limite)}</div><div class="frow"><span class="flabel">Periodicidade</span>${fv(c.periodicidade)}</div>`).join('');}
if(tid==='perfil') return a.perfil?fields(a.perfil):'<span style="color:var(--text3);font-style:italic;font-size:12px">Sem dados.</span>';
if(tid==='assembleias') return tblA(a.assembleias,a.id);
if(tid==='contatos') return tblC(a.contatos,a.id);
if(tid==='titulares') return tblT(a.titulares,a.id);
return '';}
function renderCard(a){
const nav=TABS.map((t,i)=>`<div class="tabitem${i===0?' on':''}" data-cid="${a.id}" data-tab="${t.id}">${t.label}</div>`).join('');
const panels=TABS.map((t,i)=>`<div class="tabpanel${i===0?' on':''}" id="tp-${a.id}-${t.id}">${tc(a,t.id)}</div>`).join('');
const nota=a.nota||'';
const notaPreview=nota?nota.substring(0,60)+(nota.length>60?'…':''):'Adicionar nota rápida...';
const isEnc=isEncerrado(a.status);
const toggleBtn=isEnc
?`<button class="btn-status-toggle btn-reativar" data-aid="${a.id}" title="Reativar CRA">↺ Reativar</button>`
:`<button class="btn-status-toggle btn-encerrar" data-aid="${a.id}" title="Encerrar CRA">✓ Encerrar</button>`;
return `<div class="acard" data-id="${a.id}" data-status="${a.status}" data-devedor="${a.devedor}">
<div class="cheader">
<div class="cheader-top">
<span class="ctype">CRA <span class="num-badge">${a.id}</span></span>
<div style="display:flex;align-items:center;gap:6px;position:relative">
<span class="sbadge ${sc(a.status)}"><span class="sdot"></span>${a.status}</span>
<button class="nota-btn ${nota?'has-nota':''}" data-nota-toggle="${a.id}" title="${nota?'Ver nota':'Adicionar nota'}">📝</button>
<div class="nota-popup" id="nota-panel-${a.id}">
<textarea id="nota-text-${a.id}" placeholder="Anotação rápida...">${nota}</textarea>
<div class="nota-popup-footer">
<button class="nota-popup-cancel" data-nota-cancel="${a.id}">Cancelar</button>
<button class="nota-popup-save" data-nota-save="${a.id}">Salvar</button>
</div>
</div>
</div>
</div>
<div class="cname">${a.nome}</div>
<div class="csub">${a.devedor}</div>
<div class="tabnav">${nav}</div>
</div>
<div>${panels}</div>
</div>`;}

const n=list.length;

function renderAll(){
const t=currentFilter;
const dv=document.getElementById('sfil').value;
const q=document.getElementById('srch').value.toLowerCase();
const f=DATA.filter(a=>{
if(t==='Vigente'&&a.status!=='Vigente') return false;
if(t==='Encerrada'&&!isEncerrado(a.status)) return false;
if(t==='Inadimplente'&&a.status!=='Inadimplente') return false;
if(dv&&a.devedor!==dv) return false;
if(q){const s=(a.nome+a.devedor+JSON.stringify(a.info)).toLowerCase();if(!s.includes(q))return false;}
return true;});
upd(f);

g.innerHTML=f.map(renderCard).join('');}
function goToTab(aid,tab){
setTimeout(()=>{
const card=document.querySelector(`.acard[data-id="${aid}"]`);
if(!card)return;
card.querySelectorAll('.tabitem').forEach(x=>x.classList.remove('on'));
card.querySelectorAll('.tabpanel').forEach(x=>x.classList.remove('on'));
const ti=card.querySelector(`.tabitem[data-tab="${tab}"]`);
const tp=document.getElementById(`tp-${aid}-${tab}`);
if(ti)ti.classList.add('on');if(tp)tp.classList.add('on');},0);}
let mc={id:null,tab:null};
function gf(tab){if(tab==='assembleias')return FA;if(tab==='contatos')return FC;return FT;}
function gt(tab){if(tab==='assembleias')return'Adicionar assembleia';if(tab==='contatos')return'Adicionar contato com investidor';return'Adicionar titular';}
function openM(aid,tab){
mc={id:aid,tab};
document.getElementById('modal-title').textContent=gt(tab);
const ff=gf(tab);
document.getElementById('modal-fields').innerHTML=ff.map(f=>`<div class="modal-field"><label>${f.label}</label>${f.type==='textarea'?`<textarea id="mf-${f.key}" placeholder="${f.label}"></textarea>`:`<input type="text" id="mf-${f.key}" placeholder="${f.label}">`}</div>`).join('');
document.getElementById('modal-overlay').classList.add('open');}
function closeM(){document.getElementById('modal-overlay').classList.remove('open');mc={id:null,tab:null};}
function saveM(){
const a=DATA.find(x=>x.id===mc.id)||DATA_FUNDOS.find(x=>x.id===mc.id);if(!a)return;
const ff=gf(mc.tab);const row={};
ff.forEach(f=>{const el=document.getElementById('mf-'+f.key);row[f.key]=el?el.value.trim():'';});
if(mc.tab==='assembleias'){row.hist='';a.assembleias.push(row);}
else if(mc.tab==='contatos') a.contatos.push(row);
else a.titulares.push(row);
const savedTab=mc.tab;const savedAid=mc.id;
closeM();
if(DATA_FUNDOS.find(x=>x.id===savedAid)) renderFundos(); else renderAll();
goToTab(savedAid,savedTab);}
document.getElementById('modal-cancel').addEventListener('click',closeM);
document.getElementById('modal-save').addEventListener('click',saveM);
document.getElementById('modal-overlay')?.addEventListener('click',function(e){if(e.target===this)closeM();});
let hmc={aid:null,idx:null};
function openHist(aid,idx){
const a=DATA.find(x=>x.id===aid);if(!a)return;
const r=a.assembleias[idx];if(!r)return;
hmc={aid,idx};
document.getElementById('hm-title').textContent='Histórico — '+r.data;
document.getElementById('hm-sub').textContent=r.pauta||'';
document.getElementById('hm-text').value=r.hist||'';
document.getElementById('hist-modal-overlay').classList.add('open');}
function closeHist(){document.getElementById('hist-modal-overlay').classList.remove('open');hmc={aid:null,idx:null};}
function saveHist(){
const a=DATA.find(x=>x.id===hmc.aid)||DATA_FUNDOS.find(x=>x.id===hmc.aid);if(!a)return;
a.assembleias[hmc.idx].hist=document.getElementById('hm-text').value.trim();
const savedAid=hmc.aid;
closeHist();
if(DATA_FUNDOS.find(x=>x.id===savedAid)) renderFundos(); else renderAll();
goToTab(savedAid,'assembleias');}
document.getElementById('hm-cancel').addEventListener('click',closeHist);
document.getElementById('hm-save').addEventListener('click',saveHist);
document.getElementById('hist-modal-overlay')?.addEventListener('click',function(e){if(e.target===this)closeHist();});
document.addEventListener('click',function(e){
const ab=e.target.closest('.btn-add');
if(ab){openM(parseInt(ab.dataset.aid),ab.dataset.tab);return;}
const ti=e.target.closest('.tabitem');
if(ti&&!e.target.closest('.btn-add')){
const cid=ti.dataset.cid,tab=ti.dataset.tab;
const card=document.querySelector(`.acard[data-id="${cid}"]`);
if(card){
card.querySelectorAll('.tabitem').forEach(x=>x.classList.remove('on'));
card.querySelectorAll('.tabpanel').forEach(x=>x.classList.remove('on'));
ti.classList.add('on');
const p=document.getElementById('tp-'+cid+'-'+tab);
if(p)p.classList.add('on');}
return;}
const nt=e.target.closest('[data-nota-toggle]');
if(nt){
e.stopPropagation();
const aid=nt.dataset.notaToggle;
document.querySelectorAll('.nota-popup.open').forEach(p=>{if(p.id!=='nota-panel-'+aid)p.classList.remove('open');});
const panel=document.getElementById('nota-panel-'+aid);
if(panel){
panel.classList.toggle('open');
if(panel.classList.contains('open')){
const ta=document.getElementById('nota-text-'+aid);
if(ta)setTimeout(()=>ta.focus(),50);}
}
return;}
const nc=e.target.closest('[data-nota-cancel]');
if(nc){
const aid=nc.dataset.notaCancel;
const a=DATA.find(x=>x.id==aid)||DATA_FUNDOS.find(x=>x.id==aid);
const panel=document.getElementById('nota-panel-'+aid);
if(a){const ta=document.getElementById('nota-text-'+aid);if(ta)ta.value=a.nota||'';}
if(panel)panel.classList.remove('open');
return;}
const ns=e.target.closest('[data-nota-save]');
if(ns){
const aid=parseInt(ns.dataset.notaSave);
const a=DATA.find(x=>x.id===aid)||DATA_FUNDOS.find(x=>x.id===aid);
const ta=document.getElementById('nota-text-'+aid);
if(a&&ta){
a.nota=ta.value.trim();
const prev=document.getElementById('nota-preview-'+aid);
if(prev){
const t=a.nota;
prev.textContent=t?(t.substring(0,60)+(t.length>60?'…':'')):'Adicionar nota rápida...';
prev.classList.toggle('empty',!t);}
const panel=document.getElementById('nota-panel-'+aid);
if(panel)panel.classList.remove('open');}
return;}
const stBtn=e.target.closest('.btn-status-toggle');
if(stBtn){
if(stBtn.dataset.faid){
const faid=parseInt(stBtn.dataset.faid);
const fa=DATA_FUNDOS.find(x=>x.id===faid);
if(fa){fa.status=isEncerrado(fa.status)?'Vigente':'Encerrada';renderFundos();}
} else {
const aid=parseInt(stBtn.dataset.aid);
const a=DATA.find(x=>x.id===aid);
if(a){a.status=isEncerrado(a.status)?'Vigente':'Encerrada';renderAll();}
}
return;}
const delBtn=e.target.closest('.tbl-del-btn');
if(delBtn){
if(!confirm('Excluir este registro?')) return;
const aid=parseInt(delBtn.dataset.aid);
const tab=delBtn.dataset.tab;
const idx=parseInt(delBtn.dataset.idx);
const a=DATA.find(x=>x.id===aid)||DATA_FUNDOS.find(x=>x.id===aid);
if(a){
if(tab==='assembleias') a.assembleias.splice(idx,1);
else if(tab==='contatos') a.contatos.splice(idx,1);
else if(tab==='titulares') a.titulares.splice(idx,1);
if(DATA_FUNDOS.find(x=>x.id===aid)) renderFundos(); else renderAll();
goToTab(aid,tab);}
return;}
const hb=e.target.closest('.hist-btn');
if(hb){
openHist(parseInt(hb.dataset.aid),parseInt(hb.dataset.idx));
return;}
});

function buildAlertChips(){
const inad=DATA.filter(a=>a.status==='Inadimplente').length;
const recovery=DATA.filter(a=>a.cov&&a.cov.some(c=>c.limite&&(c.limite.toLowerCase().includes('recovery')||c.limite.toLowerCase().includes('em andamento')))).length;
const notas=DATA.filter(a=>a.nota&&a.nota.trim()).length;
let html='';
if(inad>0) html+=`<span class="alert-chip red">🔴 ${inad} Inadimplente${inad>1?'s':''}</span>`;
if(recovery>0) html+=`<span class="alert-chip red">⚠️ ${recovery} em Recovery</span>`;
if(notas>0) html+=`<span class="alert-chip blue">📝 ${notas} com nota</span>`;
document.getElementById('alert-chips').innerHTML=html;}
function updateChipCounts(){
document.getElementById('chip-vig').textContent=DATA.filter(a=>a.status==='Vigente').length;
document.getElementById('chip-inad').textContent=DATA.filter(a=>a.status==='Inadimplente').length;
document.getElementById('chip-enc').textContent=DATA.filter(a=>isEncerrado(a.status)).length;
document.getElementById('chip-all').textContent=DATA.length;
buildAlertChips();}

function fmtBRL(n){if(!n||isNaN(n))return'R$ 0,00';return'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function calcInvTotal(inv){
const cra=(inv.posicoesCRA||[]).reduce((s,p)=>s+(parseFloat((p.valorInvestido||'').replace(/[^0-9,]/g,'').replace(',','.'))||0),0);
const fdo=(inv.posicoesFundo||[]).reduce((s,p)=>s+(parseFloat((p.valorInvestido||'').replace(/[^0-9,]/g,'').replace(',','.'))||0),0);
return cra+fdo;}

return `<div class="inv-row" data-inv-id="${inv.id}">

let currentFFilter='Vigente';
function scF(s){if(s==='Vigente')return 's-at';if(s==='Inadimplente')return 's-in';if(s==='Cancelada')return 's-ca';return 's-li';}
function tcF(a,tid){
if(tid==='info'){
const isEnc=isEncerrado(a.status);
const tBtn=isEnc
?`<div style="margin-top:12px;padding-top:10px;border-top:1px solid #eef2f5"><button class="btn-status-toggle btn-reativar" data-faid="${a.id}" title="Reativar">↺ Reativar fundo</button></div>`
:`<div style="margin-top:12px;padding-top:10px;border-top:1px solid #eef2f5"><button class="btn-status-toggle btn-encerrar" data-faid="${a.id}" title="Encerrar">✓ Encerrar fundo</button></div>`;
return fields(a.info)+tBtn;}
if(tid==='carteira') return fields(a.carteira);
if(tid==='prest') return fields(a.prest);
if(tid==='lim') return fields(a.lim);
if(tid==='cov'){
if(!a.cov||!a.cov.length) return '<div style="font-size:12px;color:var(--text3);font-style:italic;padding:8px 0">Nenhum covenant registrado.</div>';
return a.cov.map(c=>`<div class="frow"><span class="flabel">${c.nome}</span>${fv(c.limite)}</div><div class="frow"><span class="flabel">Periodicidade</span>${fv(c.periodicidade)}</div>`).join('');}
if(tid==='perfil') return a.perfil?fields(a.perfil):'<span style="color:var(--text3);font-style:italic;font-size:12px">Sem dados.</span>';
if(tid==='assembleias') return tblA(a.assembleias,a.id);
if(tid==='contatos') return tblC(a.contatos,a.id);
if(tid==='titulares') return tblT(a.titulares,a.id);
return '';}
function renderFundoCard(a){
const nav=TABS_FUNDO.map((t,i)=>`<div class="tabitem${i===0?' on':''}" data-cid="${a.id}" data-tab="${t.id}">${t.label}</div>`).join('');
const panels=TABS_FUNDO.map((t,i)=>`<div class="tabpanel${i===0?' on':''}" id="tp-${a.id}-${t.id}">${tcF(a,t.id)}</div>`).join('');
const nota=a.nota||'';
const notaPreview=nota?nota.substring(0,60)+(nota.length>60?'…':''):'Adicionar nota rápida...';
const isEnc=isEncerrado(a.status);
const toggleBtn=isEnc
?`<button class="btn-status-toggle btn-reativar" data-faid="${a.id}" title="Reativar fundo">↺ Reativar</button>`
:`<button class="btn-status-toggle btn-encerrar" data-faid="${a.id}" title="Encerrar fundo">✓ Encerrar</button>`;
return `<div class="acard" data-id="${a.id}" data-tipo="Fundo" data-status="${a.status}">
<div class="cheader">
<div class="cheader-top">
<span class="ctype">FUNDO <span class="num-badge">${a.id-100}</span></span>
<div style="display:flex;align-items:center;gap:6px;position:relative">
<span class="sbadge ${scF(a.status)}"><span class="sdot"></span>${a.status}</span>
<button class="nota-btn ${nota?'has-nota':''}" data-nota-toggle="${a.id}" title="${nota?'Ver nota':'Adicionar nota'}">📝</button>
<div class="nota-popup" id="nota-panel-${a.id}">
<textarea id="nota-text-${a.id}" placeholder="Anotação rápida...">${nota}</textarea>
<div class="nota-popup-footer">
<button class="nota-popup-cancel" data-nota-cancel="${a.id}">Cancelar</button>
<button class="nota-popup-save" data-nota-save="${a.id}">Salvar</button>
</div>
</div>
</div>
</div>
<div class="cname">${a.nome}</div>
<div class="csub">${a.cedente||'—'}</div>
<div class="tabnav">${nav}</div>
</div>
<div>${panels}</div>
</div>`;}
function updateFchipCounts(){
document.getElementById('fchip-vig').textContent=DATA_FUNDOS.filter(a=>a.status==='Vigente').length;
document.getElementById('fchip-inad').textContent=DATA_FUNDOS.filter(a=>a.status==='Inadimplente').length;
document.getElementById('fchip-enc').textContent=DATA_FUNDOS.filter(a=>isEncerrado(a.status)).length;
document.getElementById('fchip-all').textContent=DATA_FUNDOS.length;}
function renderFundos(){
const q=(document.getElementById('srch-fundos').value||'').toLowerCase();
const filtered=DATA_FUNDOS.filter(a=>{
if(currentFFilter==='Vigente'&&a.status!=='Vigente') return false;
if(currentFFilter==='Encerrada'&&!isEncerrado(a.status)) return false;
if(currentFFilter==='Inadimplente'&&a.status!=='Inadimplente') return false;
if(q){const s=(a.nome+a.cedente+JSON.stringify(a.info)).toLowerCase();if(!s.includes(q))return false;}
return true;});
const g=document.getElementById('fgrid');
if(!filtered.length){g.innerHTML='<div class="no-res"><svg width="32" height="32" fill="none" stroke="#9ab0bc" stroke-width="1.5" viewBox="0 0 24 24" style="display:block;margin:0 auto 10px"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>Nenhum fundo encontrado.</div>';return;}
g.innerHTML=filtered.map(renderFundoCard).join('');}
document.querySelectorAll('.fchip').forEach(c=>{
c.addEventListener('click',()=>{
document.querySelectorAll('.fchip').forEach(x=>x.classList.remove('on'));
c.classList.add('on');
currentFFilter=c.dataset.ft;
renderFundos();});});
document.getElementById('srch-fundos')?.addEventListener('input',renderFundos);
document.addEventListener('click',function(e){
if(!e.target.closest('[data-nota-toggle]')&&!e.target.closest('.nota-popup')){
document.querySelectorAll('.nota-popup.open').forEach(p=>p.classList.remove('open'));}});
currentFilter='Vigente';
document.querySelector('.chip[data-t="Vigente"]').classList.add('on');
updateChipCounts();
renderAll();
updateFchipCounts();
document.querySelector('.fchip[data-ft="Vigente"]').classList.add('on');
renderInvList();
</script>
